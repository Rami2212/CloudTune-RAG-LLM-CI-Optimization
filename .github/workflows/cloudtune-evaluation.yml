name: CloudTune GitHub-hosted A/B/C evaluation

# This workflow is the controller only. Real measured CI runs execute on
# research-owned target forks via workflow_dispatch, never in this job.
on:
  workflow_dispatch:
    inputs:
      config:
        description: 'Committed hosted evaluation configuration'
        required: true
        type: choice
        default: 'evaluation/configs/hosted_pilot.json'
        options:
          - evaluation/configs/hosted_pilot.json
  # Periodically recover queued/running fork CI attempts without re-dispatching.
  # Scheduled events run on the repository DEFAULT branch, so deploy this
  # workflow to the default branch before enabling unattended evaluation.
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches:
      - feature/evaluation-pipeline
    paths:
      - '.github/workflows/cloudtune-evaluation.yml'
      - 'evaluation/**'
      - 'tests/**'

permissions:
  contents: read

# A single controller must own the durable state branch at a time.
concurrency:
  group: cloudtune-evaluation-state-controller
  cancel-in-progress: false

jobs:
  # Cheap branch verification; never calls the LLM or dispatches forks.
  verify-feature:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m evaluation.hosted_pipeline --config evaluation/configs/hosted_pilot.json --check-config

  preflight:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      continue: ${{ steps.check.outputs.continue }}
      controller_sha: ${{ steps.check.outputs.controller_sha }}
    steps:
      - name: Check whether the hosted experiment is active
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo 'continue=true' >> "$GITHUB_OUTPUT"
            echo "controller_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          elif gh api "repos/$GITHUB_REPOSITORY/contents/runs/cloudtune-hosted-abc-pilot-001.json?ref=cloudtune-evaluation-state" \
                --jq .content 2>/dev/null | base64 -d > active-state.json && test -s active-state.json; then
            if python3 - <<'PY'
          import json
          state = json.load(open('active-state.json', encoding='utf-8'))
          rows = state.get('repositories', {})
          terminal = {'COMPLETE', 'SKIPPED', 'FAILED_TARGET_CI', 'INCONCLUSIVE_PLATFORM'}
          raise SystemExit(0 if rows and any(r.get('status') not in terminal for r in rows.values()) else 1)
          PY
            then
              echo 'continue=true' >> "$GITHUB_OUTPUT"
              echo "controller_sha=$(python3 -c 'import json; print(json.load(open("active-state.json", encoding="utf-8"))["controller_sha"])')" >> "$GITHUB_OUTPUT"
            else
              echo 'continue=false' >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'continue=false' >> "$GITHUB_OUTPUT"
          fi

  evaluate:
    needs: preflight
    if: needs.preflight.outputs.continue == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # Dedicated state branch; not target-repo access
    env:
      # No research secrets are exposed during dependency installation/build.
      CI_COST_DIR: ${{ runner.temp }}/cloudtune-ci-cost
      HF_HOME: ${{ runner.temp }}/cloudtune-huggingface
      CLOUDTUNE_CONTROLLER_SHA: ${{ needs.preflight.outputs.controller_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.controller_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-rag.txt
      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build the versioned source-corrected ci-cost comparator
        run: |
          python -m evaluation.third_party.ci_cost.setup
          python -m evaluation.third_party.ci_cost.setup --verify
      - name: Run evaluation regression tests
        run: |
          python -m unittest discover -s tests -v
          python -m evaluation.hosted_pipeline --config evaluation/configs/hosted_pilot.json --check-config
      - name: Start or resume GitHub Actions fork measurements
        env:
          EVENT: ${{ github.event_name }}
          SELECTED_CONFIG: ${{ inputs.config }}
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDTUNE_FORK_TOKEN: ${{ secrets.CLOUDTUNE_FORK_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        shell: bash
        run: |
          CONFIG="${SELECTED_CONFIG:-evaluation/configs/hosted_pilot.json}"
          if [ "$EVENT" = schedule ] && [ "$GITHUB_SHA" != "$CLOUDTUNE_CONTROLLER_SHA" ]; then
            # A scheduled run is loaded from the moving default branch. Keep
            # the *executing workflow definition* identical to the study's
            # pinned revision, not merely the checked-out Python code.
            git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
            git show "$GITHUB_SHA:.github/workflows/cloudtune-evaluation.yml" > "$RUNNER_TEMP/current-controller.yml"
            cmp -s "$RUNNER_TEMP/current-controller.yml" .github/workflows/cloudtune-evaluation.yml || {
              echo '::error::Controller workflow changed on default branch; resume cannot be considered protocol-identical'
              exit 1
            }
          fi
          if [ "$EVENT" = schedule ]; then
            python -m evaluation.hosted_pipeline --config "$CONFIG" --resume-only
          else
            python -m evaluation.hosted_pipeline --config "$CONFIG"
          fi
      - name: Archive controller logs and reports even for incomplete batches
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudtune-evaluation-${{ github.run_id }}
          path: evaluation/results/
          if-no-files-found: warn
          retention-days: 30
