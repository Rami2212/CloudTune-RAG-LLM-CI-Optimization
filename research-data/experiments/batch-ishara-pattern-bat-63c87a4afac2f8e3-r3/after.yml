name: Plugin skill sync

on:
  workflow_dispatch:
  pull_request:
    branches: [ "master" ]
    paths:
      - '.codex/skills/pymobiledevice3-device-operator/**'
      - 'misc/claude-plugin/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: '! github.event.pull_request.draft'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip' # Caching dependencies based on pyproject.toml

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install .

      - name: Verify the vendored plugin skill matches the canonical source
        run: python3 misc/claude-plugin/sync_skill.py --check
