on:
  push: null
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  reuse-compliance-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache REUSE metadata
        uses: actions/cache@v4
        with:
          path: .reuse
          key: ${{ runner.os }}-reuse-${{ hashFiles('LICENSE', 'NOTICE', '.reuse') }}
          restore-keys: |
            ${{ runner.os }}-reuse-
      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@v6
