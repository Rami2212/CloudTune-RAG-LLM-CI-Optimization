'on':
  push: null
  pull_request: null
  workflow_dispatch: null
jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@master

    - name: npm install
      run: npm install

    - name: build
      run: |
        docker build -t sightreading-test .

    - name: test
      run: |
        docker run sightreading-test
