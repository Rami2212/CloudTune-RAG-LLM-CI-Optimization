name: CloudTune controlled scenario
'on':
  push:
    branches:
    - ct-scenario/**
    paths:
    - src/**
    - config/**
    - .github/workflows/**
permissions:
  contents: read
jobs:
  probe:
    name: probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Controlled workload
      shell: bash
      run: 'sleep 5

        printf ''probe completed\n''

        '