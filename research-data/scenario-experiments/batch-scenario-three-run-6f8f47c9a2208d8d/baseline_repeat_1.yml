name: CloudTune controlled scenario
'on':
  push:
    branches:
    - ct-scenario/**
permissions:
  contents: read
jobs:
  probe:
    name: probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Controlled workload
      shell: bash
      run: 'python3 - <<''CLOUDTUNE_REPLAY_ENGINE''

        import base64, zlib

        exec(compile(zlib.decompress(base64.b64decode('''')),
        ''scenario_replay.py'', ''exec''))

        CLOUDTUNE_REPLAY_ENGINE

        '
      env:
        CT_PATTERN: P-LIT-PRIORITIZE
        CT_POLICY: '{"enabled": false, "pattern": "P-LIT-PRIORITIZE", "preserve_required_outputs":
          true, "unknown_inputs": "run_all", "workers": 1}'
        CT_DATA: '{"past_failures": ["regression"], "tests": [{"duration": 30, "id":
          "slow", "outcome": "success"}, {"duration": 5, "id": "regression", "outcome":
          "failure"}, {"duration": 10, "id": "healthy", "outcome": "success"}]}'
