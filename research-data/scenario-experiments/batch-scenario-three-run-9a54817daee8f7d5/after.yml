name: CloudTune controlled scenario
'on':
  push:
    branches:
    - ct-scenario/**
permissions:
  contents: read
jobs:
  probe:
    name: probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Controlled workload
      shell: bash
      run: 'sleep 90

        printf "revision completed\n"

        '
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
