name: CloudTune controlled scenario
'on':
  push:
    branches:
    - ct-scenario/**
permissions:
  contents: read
jobs:
  probe:
    name: cell-${{ matrix.cell }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Controlled workload
      shell: bash
      run: "if [[ \"$CELL\" == \"fail\" && \"$MESSAGE\" == *\"[ct-fail]\"* ]]; then\n  sleep 20\n  exit 1\nfi\nsleep 90\nprintf \"healthy cell completed\\n\"\n"
      env:
        CELL: ${{ matrix.cell }}
        MESSAGE: ${{ github.event.head_commit.message }}
    strategy:
      fail-fast: true
      max-parallel: 3
      matrix:
        cell:
        - fail
        - worker-a
        - worker-b
