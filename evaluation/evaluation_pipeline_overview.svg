<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" role="img" aria-labelledby="title desc">
<title id="title">CloudTune evaluation pipeline overview</title><desc id="desc">Held-out repositories are screened and pinned, then evaluated as Original, ci-cost, and LLM plus RAG arms. Optimized candidates pass a common validation gate before repeated CI execution on research forks. Raw evidence feeds paired repository-level analysis, with all excluded and failed outcomes retained.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#65768f"/></marker></defs>
<style>text{font-family:Segoe UI,Arial,sans-serif} .title{font-size:32px;font-weight:700;fill:#14263e}.sub{font-size:16px;fill:#56677d}.h{font-size:20px;font-weight:650;fill:#14263e}.b{font-size:16px;fill:#42566e}.tag{font-size:13px;font-weight:700;letter-spacing:1.5px;fill:#546b86}.line{fill:none;stroke:#65768f;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1440" height="1280" fill="#f3f6fa"/>
<text x="64" y="67" class="tag">CLOUDTUNE / RESEARCH EVALUATION</text>
<text x="64" y="110" class="title">From held-out repositories to measured CI outcomes</text>
<text x="64" y="143" class="sub">Three arms • same pinned source • shared safety checks • repository-level comparisons</text>

<rect x="64" y="182" width="620" height="133" rx="16" fill="#ffffff" stroke="#d7e0eb"/>
<text x="88" y="214" class="tag">01 / SELECT</text>
<text x="88" y="245" class="h">Screen the held-out cohort</text>
<text x="88" y="274" class="b">Start from the 4,000-repository candidate pool.</text>
<text x="88" y="298" class="b">Check eligibility; exclude training / development overlap.</text>
<rect x="744" y="182" width="632" height="133" rx="16" fill="#ffffff" stroke="#d7e0eb"/>
<text x="768" y="214" class="tag">02 / PIN</text>
<text x="768" y="245" class="h">Freeze one shared input</text>
<text x="768" y="274" class="b">Pin commit, workflow, source context and required checks.</text>
<text x="768" y="298" class="b">Archive configuration, versions and content hashes.</text>
<path d="M684 248 H734" class="line"/>
<path d="M1060 315 V340 H276 M720 340 H1164 M276 340 V363 M720 340 V363 M1164 340 V363" fill="none" stroke="#65768f" stroke-width="2"/>
<rect x="64" y="364" width="424" height="173" rx="16" fill="#edf3fc" stroke="#adc5e7"/>
<text x="88" y="396" class="tag">ARM A / BASELINE</text>
<text x="88" y="427" class="h">Original workflow</text>
<text x="88" y="456" class="b">Unmodified pinned workflow.</text>
<text x="88" y="480" class="b">Provides the elapsed-time and</text>
<text x="88" y="504" class="b">runner-use reference.</text>
<rect x="508" y="364" width="424" height="173" rx="16" fill="#eef9f6" stroke="#a4d5c9"/>
<text x="532" y="396" class="tag">ARM B / RULE BASED</text>
<text x="532" y="427" class="h">ci-cost optimizer</text>
<text x="532" y="456" class="b">Rule-based candidate generation</text>
<text x="532" y="480" class="b">from the same pinned snapshot.</text>
<text x="532" y="504" class="b">Record APPLY, NO_CHANGE or ERROR.</text>
<rect x="952" y="364" width="424" height="173" rx="16" fill="#f3effc" stroke="#c8b6eb"/>
<text x="976" y="396" class="tag">ARM C / RETRIEVE + GENERATE</text>
<text x="976" y="427" class="h">LLM + RAG optimizer</text>
<text x="976" y="456" class="b">BGE-M3 → frozen Supabase evidence</text>
<text x="976" y="480" class="b">Relevant patterns + repository context</text>
<text x="976" y="504" class="b">Fixed LLM → candidate + cited IDs</text>
<path d="M720 537 V571" class="line"/>
<path d="M1164 537 V554 H1100 V571" class="line"/>
<rect x="508" y="572" width="868" height="139" rx="16" fill="#ffffff" stroke="#d7e0eb"/>
<text x="532" y="604" class="tag">03 / VALIDATE B + C</text>
<text x="532" y="635" class="h">Common candidate validation</text>
<text x="532" y="664" class="b">Allowed workflow changes • YAML / actionlint • required-check contract</text>
<text x="532" y="688" class="b">Preserve build/test coverage, permissions and security constraints.</text>
<text x="532" y="712" class="b">Archive verdicts; only admitted optimized candidates proceed.</text>
<path d="M276 537 V757 H498" class="line"/>
<path d="M942 711 V757 H832 V785" class="line"/>
<text x="83" y="615" class="sub">A stays unchanged</text><text x="83" y="639" class="sub">and bypasses optimization.</text>
<rect x="64" y="786" width="424" height="174" rx="16" fill="#fff7e9" stroke="#e6ce9e"/>
<text x="88" y="818" class="tag">RETAIN ALL OUTCOMES</text>
<text x="88" y="849" class="h">Outcome accounting</text>
<text x="88" y="878" class="b">Screened out • NO_CHANGE • errors</text>
<text x="88" y="902" class="b">Rejected / review-required candidates</text>
<text x="88" y="926" class="b">CI failures • platform inconclusive</text>
<text x="88" y="950" class="b">Retain counts and reasons in reports.</text>
<rect x="508" y="786" width="868" height="174" rx="16" fill="#ffffff" stroke="#d7e0eb"/>
<text x="532" y="818" class="tag">04 / EXECUTE + COLLECT</text>
<text x="532" y="849" class="h">Repeated CI on research-owned forks</text>
<text x="532" y="878" class="b">Provision isolated arms from the same source; run admitted candidates.</text>
<text x="532" y="902" class="b">Interleave A / B / C across configured repetitions; checkpoint for resume.</text>
<text x="532" y="926" class="b">Baseline failure stops the repository; optimized failure stops that arm.</text>
<text x="532" y="950" class="b">Archive evidence and finalize measurements before fork cleanup.</text>
<path d="M942 960 V992" class="line"/>
<rect x="508" y="993" width="868" height="110" rx="16" fill="#ffffff" stroke="#d7e0eb"/>
<text x="532" y="1025" class="h">Raw GitHub evidence + timing</text>
<text x="532" y="1054" class="b">Active workflow time = union of running-job intervals; runner time = sum of jobs.</text>
<text x="532" y="1078" class="b">Record required checks, conclusions, queue time and makespan separately.</text>
<path d="M942 1103 V1135" class="line"/>
<path d="M276 960 V1191 H498" class="line"/>
<rect x="508" y="1136" width="868" height="108" rx="16" fill="#eaf2fc" stroke="#adc5e7"/>
<text x="532" y="1168" class="h">Paired analysis and reports</text>
<text x="532" y="1197" class="b">Within-repository medians → B vs A, C vs A, C vs B.</text>
<text x="532" y="1221" class="b">Report savings, IQR, repository-bootstrap 95% CIs and outcome counts.</text>
<text x="64" y="1011" class="sub">Execution scope</text><text x="64" y="1041" class="b">Coordinator, optimizers and analysis:</text><text x="64" y="1065" class="b">local machine</text><text x="64" y="1105" class="b">Measured builds and tests:</text><text x="64" y="1129" class="b">candidate-fork GitHub Actions</text>
<text x="64" y="1268" font-size="12" fill="#677b93">Source: evaluation/fork_pipeline.py, results_exporter.py and PIPELINE_GUIDE.md • Implementation overview; no performance result implied.</text></svg>