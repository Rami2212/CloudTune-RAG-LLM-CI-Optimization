# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 1 optimization:
# - [MEDIUM] Use "npm ci" instead of "npm install" in "spellcheck"
# Estimated savings: ~1 min/run
#
name: "🧑‍🏫 Spellcheck"
on:
  push:

jobs:
  spellcheck:
    name: "🧑‍🏫 Spellcheck"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "."
    steps:
      - uses: actions/checkout@v7
        name: 🧾 Checkout

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm install

      - name: 📝 Check Spelling
        run: |
          npx cspell lint -c ./cspell.json
