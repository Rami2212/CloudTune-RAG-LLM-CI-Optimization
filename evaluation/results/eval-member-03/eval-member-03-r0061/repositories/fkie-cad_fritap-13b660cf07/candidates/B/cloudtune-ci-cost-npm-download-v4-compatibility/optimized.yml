# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 9 optimizations:
# - [HIGH] Add pip dependency cache to "test" job
# - [HIGH] Add pip dependency cache to "version-guard" job
# - [HIGH] Add pip dependency cache to "legacy-constraints-check" job
# - [HIGH] Add npm dependency cache to "agent-build-check" job
# - [HIGH] Add pip dependency cache to "leak-guard" job
# - [HIGH] Add pip dependency cache to "smoke-import" job
# - [MEDIUM] Add concurrency group to "ci.yml"
# - [MEDIUM] 6 jobs clone the repo — consider artifact sharing
# - [LOW] Explicitly set fail-fast for large matrix job "legacy-constraints-check" (18 combinations)
# Estimated savings: ~24 min/run
#
name: CI
'on':
  push:
    branches:
      - main
  pull_request: null
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - run: pytest tests/unit -q
  version-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - run: python dev/check_compat.py
  legacy-constraints-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.11'
          - '3.13'
        era:
          - frida15
          - frida16
          - frida17-legacy
        include:
          - era: frida15
            version: 1.3.3.3
          - era: frida16
            version: 1.4.3.0
          - era: frida17-legacy
            version: 1.6.3.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: |
          pip install --dry-run \
            "fritap==${{ matrix.version }}" \
            -c "constraints/${{ matrix.era }}.txt"
  agent-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned toolchain (lockfile-enforced)
        run: npm ci --ignore-scripts
      - name: Fetch frida native binding
        run: npm rebuild frida
      - name: Install frida-tools (provides frida-pm)
        run: |
          python -m pip install --upgrade pip
          pip install "frida-tools>=14.0.0,<15.0.0"
      - name: Rebuild agent
        run: ./dev/compile_agent.sh
      - name: Verify committed agents match rebuild
        run: |
          if ! git diff --exit-code -- friTap/fritap_agent.js friTap/fritap_memscan.js; then
            echo "::error ::A committed agent bundle does not match a fresh rebuild from agent/. Run ./dev/compile_agent.sh locally and commit the result."
            exit 1
          fi
      - name: Run agent unit tests (main + memscan)
        run: |
          npm run test:agent
          npm run test:memscan-agent
      - name: Build manifest
        run: |
          {
            echo "## Agent build manifest"
            echo "frida-compile: $(node -p "require('frida-compile/package.json').version")"
            echo "node: $(node --version)"
            echo "agent SHA-256: $(sha256sum friTap/fritap_agent.js | awk '{print $1}')"
            echo "agent size: $(wc -c < friTap/fritap_agent.js) bytes"
          } | tee BUILD_MANIFEST.txt
      - uses: actions/upload-artifact@v4
        with:
          name: agent-build-manifest
          path: BUILD_MANIFEST.txt
  leak-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - name: Public-tree leak guard
        run: |
          set +e
          bash scripts/check_public_denylist.sh
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then
            echo "::error ::Leak guard HARD violation: private code/protocol present in the public tree."
            exit 1
          elif [ "$rc" -eq 2 ]; then
            echo "::notice ::Leak guard PASS-structural: accepted bare-'signal' reveal-token residuals remain (operational-privacy stance; the HARD structural/dist rules are the contract). Exit 2 is the intended steady state."
            exit 0
          elif [ "$rc" -ne 0 ]; then
            echo "::error ::Leak guard errored (rc=$rc)."
            exit 1
          fi
          echo "Leak guard clean."
  smoke-import:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        frida-version:
          - 17.9.6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "frida==${{ matrix.frida-version }}"
      - name: Import smoke test
        run: |
          python -c "import friTap; print('friTap', friTap.__version__)"
          python -c "from friTap.backends.frida_backend import FridaBackend; FridaBackend()"
