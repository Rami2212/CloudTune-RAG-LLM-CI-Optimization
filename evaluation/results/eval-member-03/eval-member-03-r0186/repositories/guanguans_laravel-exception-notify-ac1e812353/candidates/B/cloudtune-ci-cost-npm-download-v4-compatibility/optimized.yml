# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 2 optimizations:
# - [HIGH] Add npm dependency cache to "lint-markdown" job
# - [MEDIUM] Add concurrency group to "lint-md.yml"
# Estimated savings: ~6 min/run
#
name: lint-md

on:
  workflow_dispatch:
  push:
  pull_request:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint-markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set node version
        uses: actions/setup-node@v7

      - name: Install lint-md
        run: npm install -g @lint-md/cli

      - name: Lint markdown
        run: lint-md --suppress-warnings *.md .github/ docs/
