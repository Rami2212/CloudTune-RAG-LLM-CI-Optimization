# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 5 optimizations:
# - [HIGH] Add npm dependency cache to "build" job
# - [HIGH] Add npm dependency cache to "lint" job
# - [HIGH] Switch "build" from macOS to ubuntu runner
# - [HIGH] Switch "lint" from macOS to ubuntu runner
# - [MEDIUM] Add concurrency group to "ci.yml"
# Estimated savings: ~10 min/run
#
name: CI
'on':
  push:
    branches:
      - master
  pull_request: null
  workflow_dispatch: null
env:
  NODE_VERSION: 22
  JAVA_VERSION: 21
jobs:
  build:
    name: Build
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
      - name: Install dependencies
        run: npm ci
      - name: Build iOS
        run: npm run verify:ios
      - name: Build Android
        run: npm run verify:android
      - name: Build Web
        run: npm run verify:web
      - name: Build Electron
        run: npm run verify:electron
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Lint script
        run: npm run lint
