# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 9 optimizations:
# - [HIGH] Add npm dependency cache to "lint-js" job
# - [HIGH] Add npm dependency cache to "check-engines" job
# - [HIGH] Add npm dependency cache to "test-pack" job
# - [HIGH] Add npm dependency cache to "tests" job
# - [MEDIUM] Add concurrency group to "tests.yml"
# - [MEDIUM] Use "npm ci" instead of "npm install" in "lint-js"
# - [MEDIUM] Use "npm ci" instead of "npm install" in "check-engines"
# - [MEDIUM] Use "npm ci" instead of "npm install" in "test-pack"
# - [LOW] Explicitly set fail-fast for large matrix job "tests" (108 combinations)
# Estimated savings: ~23 min/run
#
name: Tests
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call: null
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89
        with:
          args: check --select=E,F,PLC,PLE,UP,W,YTT --ignore=E721,PLC0206,PLC0415,PLC1901,S101,UP031 --target-version=py39
      - run: ruff format --check --diff --config="extend-exclude=['README.md', 'docs/Linking-to-OpenSSL.md']"
  lint-js:
    name: Lint JS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use Node.js 22.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.x
          cache: npm
      - name: Install Dependencies
        run: npm install
      - name: Lint
        run: npm run lint
  check-engines:
    name: Check Engines
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use Node.js 22.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.x
          cache: npm
      - name: Install Dependencies
        run: npm install
      - name: Check Engines
        run: |
          # TODO: move this to its own action
          npm install @npmcli/arborist@7 semver@7 --no-save
          node .github/scripts/check-engines.js
  test-pack:
    name: Test Pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use Node.js 22.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.x
          cache: npm
      - name: Update npm
        run: |
          npm install npm@~11.10.0 -g # Workaround for https://github.com/npm/cli/issues/9151
          npm install npm@latest -g
      - name: Install Dependencies
        run: npm install
      - name: Pack
        id: pack
        env:
          NODE_GYP_TEMP_DIR: ${{ runner.temp }}/node-gyp
        run: |
          mkdir -p $NODE_GYP_TEMP_DIR
          npm pack
          tar xzf *.tgz -C $NODE_GYP_TEMP_DIR --strip-components=1
          cp -r test/ $NODE_GYP_TEMP_DIR/test/
          echo "dir=$NODE_GYP_TEMP_DIR" >> "$GITHUB_OUTPUT"
      - name: Test
        working-directory: ${{ steps.pack.outputs.dir }}
        env:
          FULL_TEST: '1'
        run: |
          npm install
          npm test
  tests:
    strategy:
      fail-fast: false
      max-parallel: 11
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        python:
          - '3.10'
          - '3.12'
          - '3.14'
          - '3.15'
        node:
          - 22.x
          - 24.x
          - 26.x
        include:
          - os: macos-26-intel
            python: '3.14'
            node: 26.x
          - os: ubuntu-26.04-arm
            python: '3.14'
            node: 26.x
          - os: windows-11-arm
            python: '3.14'
            node: 26.x
    name: ${{ matrix.os }} - ${{ matrix.python }} - ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      WASI_VERSION: '25'
      WASI_VERSION_FULL: '25.0'
      WASI_SDK_PATH: wasi-sdk-25.0
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Use Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67
      - name: Install wasi-sdk (Windows)
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          $MaxRetries = 3
          $RetryDelay = 10
          $Attempt = 0
          while ($Attempt -lt $MaxRetries) {
            try {
              Start-BitsTransfer -Source https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${env:WASI_VERSION}/wasi-sdk-${env:WASI_VERSION_FULL}-x86_64-windows.tar.gz
              break
            }
            catch {
              Write-Host "Error: $($_.Exception.Message)"
              $Attempt++
              if ($Attempt -lt $MaxRetries) {
                Write-Host "Retrying in $RetryDelay seconds"
                Start-Sleep -Seconds $RetryDelay
              }
              else {
                Write-Host "Max retries reached. Download failed."
                exit 1
              }
            }
          }
          New-Item -ItemType Directory -Path ${env:WASI_SDK_PATH}
          tar -zxvf wasi-sdk-${env:WASI_VERSION_FULL}-x86_64-windows.tar.gz -C ${env:WASI_SDK_PATH} --strip 1
      - name: Install Dependencies
        run: |
          npm install
          pip install pytest
      - name: Set Windows Env
        if: runner.os == 'Windows'
        run: |
          echo 'GYP_MSVS_VERSION=2015' >> $Env:GITHUB_ENV
          echo 'GYP_MSVS_OVERRIDE_PATH=C:\\Dummy' >> $Env:GITHUB_ENV
      - name: Run Python Tests
        run: python -m pytest
      - name: Run Tests (macOS or Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: npm test --python="${pythonLocation}/python"
        env:
          FULL_TEST: ${{ (matrix.node == '26.x' && matrix.python == '3.14') && '1' || '0' }}
      - name: Run Tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: npm run test --python="${pythonLocation}\\python.exe"
        env:
          FULL_TEST: ${{ (matrix.node == '26.x' && matrix.python == '3.14') && '1' || '0' }}
