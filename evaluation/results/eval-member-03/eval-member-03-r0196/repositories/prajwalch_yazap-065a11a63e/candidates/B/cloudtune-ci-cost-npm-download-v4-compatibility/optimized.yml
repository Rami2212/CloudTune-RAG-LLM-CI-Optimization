# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 1 optimization:
# - [MEDIUM] Add concurrency group to "test.yml"
# Estimated savings: ~2 min/run
#
name: test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup zig master build
        uses: goto-bus-stop/setup-zig@v2.2.0
        with:
          version: master

      - name: Run a build test
        run: zig build test

      - name: Run test by passing test file
        run: zig test src/test.zig

      - name: Build examples
        run: zig build examples
