# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 1 optimization:
# - [MEDIUM] Add concurrency group to "README_CHANGELOG_TOC2.yml"
# Estimated savings: ~2 min/run
#
# https://github.com/technote-space/toc-generator
name: README_CHANGELOG_TOC2
on:
  push:
    branches: master
  pull_request:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate TOC
        uses: technote-space/toc-generator@v4
        with:
          # Fichiers/Globs à cibler
          TARGET_PATHS: |
            README.md
            CHANGELOG.md
            docs/**/*.md
          # Options utiles
          # GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # MAX_HEADER_LEVEL: 6
          # MIN_HEADER_LEVEL: 2
