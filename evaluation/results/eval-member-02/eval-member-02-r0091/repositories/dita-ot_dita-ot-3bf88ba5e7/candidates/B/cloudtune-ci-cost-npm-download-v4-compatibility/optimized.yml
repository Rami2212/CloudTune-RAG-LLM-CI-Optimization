# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 1 optimization:
# - [MEDIUM] Add concurrency group to "test.yml"
# Estimated savings: ~2 min/run
#
name: Test
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Cache NPM
        uses: actions/cache@v6
        with:
          path: |
            .gradle/nodejs
            build/spotless-*
            build/tmp/spotless-register-dependencies
          key: ${{ runner.os }}-${{ hashFiles('.prettierrc') }}-${{ hashFiles('.nvmrc') }}
      - name: Start Gradle Daemon
        run: ./gradlew --dry-run
      - name: Check formatting
        run: ./gradlew spotlessCheck --info --stacktrace
      - name: Build with Gradle
        run: ./gradlew --info --stacktrace
      - name: Run unit tests
        run: ./gradlew test --info --stacktrace
      - name: Run end to end tests
        run: ./gradlew e2eTest --info --stacktrace
      - name: Run integration tests
        run: ./gradlew integrationTest --info --stacktrace
      - name: Stop Gradle Daemon
        if: always()
        run: ./gradlew --stop
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2.24.0
        if: (!cancelled())
        with:
          files: build/test-results/**/*.xml