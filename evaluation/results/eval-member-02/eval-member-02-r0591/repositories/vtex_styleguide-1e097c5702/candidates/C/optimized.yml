name: Test CI

on:
  pull_request:
    branches:
    - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 12.x
      uses: actions/setup-node@v4
      with:
        node-version: 12.x
        cache: 'yarn'
    - name: Run tests
      run: |
        yarn
        yarn test --passWithNoTests
      env:
        CI: true
