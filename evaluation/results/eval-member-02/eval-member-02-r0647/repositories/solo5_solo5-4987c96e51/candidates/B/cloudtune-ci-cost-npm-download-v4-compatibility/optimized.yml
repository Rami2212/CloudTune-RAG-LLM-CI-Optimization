# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 2 optimizations:
# - [MEDIUM] Add concurrency group to "lint.yml"
# - [LOW] Explicitly set fail-fast for large matrix job "formatting-check" (5 combinations)
# Estimated savings: ~4 min/run
#
name: clang-format Check
on:
  push:
    branches:
      - main
  pull_request:

# Restrict the GITHUB_TOKEN

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}

jobs:
  formatting-check:
    name: Formatting Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path:
          - 'bindings'
          - 'tests'
          - 'include'
          - 'tenders'
          - 'elftool'
    steps:
    - uses: actions/checkout@v7
    - name: Run clang-format style check for Solo5.
      uses: jidicula/clang-format-action@v4.16.0
      with:
        clang-format-version: '22'
        check-path: ${{ matrix.path }}
