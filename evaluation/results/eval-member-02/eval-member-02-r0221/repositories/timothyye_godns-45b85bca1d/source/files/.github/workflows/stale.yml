name: Close inactive issues

on:
  schedule:
    # Runs daily at 01:30 UTC.
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  close-issues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-issue-stale: 90
          days-before-issue-close: 14
          stale-issue-label: "stale"
          exempt-issue-labels: "pinned,security,help wanted"
          stale-issue-message: >-
            This issue is stale because it has been open for 90 days with no activity.
            It will be closed in 14 days unless there is new activity.
            Remove the stale label or leave a comment to keep it open.
          close-issue-message: >-
            This issue was closed because it has been inactive for 14 days since being marked as stale.
            Feel free to reopen it or open a new issue if the problem still exists.
          # Pull requests are never marked stale or closed.
          days-before-pr-stale: -1
          days-before-pr-close: -1
          operations-per-run: 100
