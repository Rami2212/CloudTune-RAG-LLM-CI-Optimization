name: Concerto Platform CI

on:
  push:
    branches:
      - 5.0-dev
      - 5.1-dev

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: concerto_test
        ports:
          - '127.0.0.1:3306:3306'

    steps:
      - name: Git checkout
        uses: actions/checkout@v3

      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 14

      - name: Cache npm global
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: |
            vendor
            ~/.composer/cache
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        uses: php-actions/composer@v6
        with:
          php_version: 7.4
          version: 2.2.21

      - name: Cache Bower components (PanelBundle)
        uses: actions/cache@v4
        with:
          path: src/Concerto/PanelBundle/Resources/public/angularjs/bower_components
          key: ${{ runner.os }}-bower-panel-${{ hashFiles('src/Concerto/PanelBundle/Resources/public/angularjs/bower.json') }}
          restore-keys: |
            ${{ runner.os }}-bower-panel-

      - name: Cache Bower components (TestBundle)
        uses: actions/cache@v4
        with:
          path: src/Concerto/TestBundle/Resources/public/angularjs/bower_components
          key: ${{ runner.os }}-bower-test-${{ hashFiles('src/Concerto/TestBundle/Resources/public/angularjs/bower.json') }}
          restore-keys: |
            ${{ runner.os }}-bower-test-

      - name: Install bower
        run: npm install -g bower

      - name: Install JS dependencies (1/2)
        run: cd ${{ github.workspace }}/src/Concerto/PanelBundle/Resources/public/angularjs && bower install --allow-root

      - name: Install JS dependencies (2/2)
        run: cd ${{ github.workspace }}/src/Concerto/TestBundle/Resources/public/angularjs && bower install --allow-root

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build test image
        run: bash ./build/github-actions/docker_test_build.sh

      - name: Install docker-compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/v2.3.3/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose
          docker-compose --version
        continue-on-error: false

      - name: Test
        run: docker-compose -f ./build/github-actions/docker-compose.yml up --build --exit-code-from concerto

      - name: Docker publish
        run: bash ./build/github-actions/docker_publish.sh
        env:
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}