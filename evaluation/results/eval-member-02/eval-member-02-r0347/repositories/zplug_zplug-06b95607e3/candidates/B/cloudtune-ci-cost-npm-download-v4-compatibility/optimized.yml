# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 1 optimization:
# - [MEDIUM] Add concurrency group to "test.yml"
# Estimated savings: ~2 min/run
#
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y zsh gawk

      - name: Run tests
        run: make test
