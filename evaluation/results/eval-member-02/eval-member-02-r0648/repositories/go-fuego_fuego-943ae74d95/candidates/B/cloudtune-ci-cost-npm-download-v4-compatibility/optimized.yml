# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 1 optimization:
# - [HIGH] Add npm dependency cache to "build" job
# Estimated savings: ~4 min/run
#
name: Deploy Docusaurus site to Pages
'on':
  push:
    branches:
      - main
      - pages/**
    paths:
      - documentation/**
  workflow_dispatch: null
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
        working-directory: ./documentation
      - name: Build Docusaurus site
        run: npm run build
        working-directory: ./documentation
      - name: Upload artifact for deployment
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./documentation/build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Print page URL
        run: echo "Deployed to ${PAGES_URL}"
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
