# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 2 optimizations:
# - [HIGH] Add npm dependency cache to "npm-install" job
# - [MEDIUM] Add concurrency group to "npm-install.yml"
# Estimated savings: ~6 min/run
#
name: npm CI
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  npm-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Run npm install
        run: |
          cd docs
          npm install
          npm run build
