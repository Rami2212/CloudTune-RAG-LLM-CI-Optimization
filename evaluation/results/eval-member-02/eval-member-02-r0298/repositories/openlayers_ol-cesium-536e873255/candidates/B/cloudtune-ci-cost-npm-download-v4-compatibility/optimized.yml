# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 2 optimizations:
# - [HIGH] Add npm dependency cache to "deploy" job
# - [HIGH] Split "deploy" into parallel jobs (lint + test + build)
# Estimated savings: ~10 min/run
#
name: Deploy website
'on':
  push:
    tags:
      - v*.*.*
  workflow_dispatch: null
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build examples
        run: npm run build-examples
      - name: Build API docs
        run: npm run doc && cp -R apidoc dist/doc
      - name: Generate index page
        run: |
          node buildtools/generate-index.js
          cp -R gh-pages-template/images dist/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
