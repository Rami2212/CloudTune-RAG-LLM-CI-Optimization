# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 4 optimizations:
# - [HIGH] Add npm dependency cache to "Lint" job
# - [HIGH] Add npm dependency cache to "Test" job
# - [HIGH] Add npm dependency cache to "Build" job
# - [MEDIUM] 3 jobs clone the repo — consider artifact sharing
# Estimated savings: ~13 min/run
#
name: CI

on:
  - pull_request
  - push

jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - run: npm ci
      - run: npx xo

  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - run: npm ci
      - run: npm run test:unit

  Build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - run: npm ci
      - run: npm run build
      - name: Ensure that test URLs aren't included in the built file
        run: '! grep http distribution/index.js'
