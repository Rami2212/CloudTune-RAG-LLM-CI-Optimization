# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 3 optimizations:
# - [HIGH] Add pip dependency cache to "build" job
# - [MEDIUM] Add concurrency group to "unit-build.yml"
# - [LOW] Explicitly set fail-fast for large matrix job "build" (5 combinations)
# Estimated savings: ~7 min/run
#
# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Build

on:
  push:
    branches: [ master, release ]
  pull_request:
    branches: [ master, release ]
  workflow_dispatch:  # manually launch from GitHub actions


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14' ]

    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install .
        pip install .[extra]
        pip install pytest-cov
    - name: Test with pytest
      run: |
        pytest --cov=fedot -s test/unit
    - name: Codecov-coverage
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
