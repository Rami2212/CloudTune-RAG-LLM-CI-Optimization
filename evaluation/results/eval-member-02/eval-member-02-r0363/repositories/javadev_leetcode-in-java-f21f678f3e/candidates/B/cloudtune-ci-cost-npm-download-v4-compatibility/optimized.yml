# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 6 optimizations:
# - [MEDIUM] Add concurrency group to "maven.yml"
# - [MEDIUM] Switch "build-windows" from Windows to ubuntu runner
# - [LOW] Use shallow clone in "build-linux" job
# - [LOW] Use shallow clone in "build-windows" job
# - [LOW] Use shallow clone in "build-macos" job
# - [LOW] Use shallow clone in "build-sonar" job
# Estimated savings: ~2 min/run
#
# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: read-all
jobs:
  build-linux:
    name: build-linux

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        distribution: 'corretto'
        java-version: '25'
        cache: 'gradle'
    - name: Cache SonarCloud packages
      uses: actions/cache@v5
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar
    - name: Build with Gradle
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: f4f48f5dc3d59b444b238326cdf534ae5614cc59
      run: chmod +x gradlew && ./gradlew spotlessJavaCheck test jacocoTestReport sonar -Dsonar.projectKey=javadev_LeetCode-in-Java -Dsonar.host.url=https://sonarcloud.io -Dsonar.organization=javadev-github

  build-windows:
    name: build-windows

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        distribution: 'corretto'
        java-version: '25'
        cache: 'gradle'
    - name: Build with Gradle
      run: ./gradlew test --no-daemon

  build-macos:
    name: build-macos

    runs-on: macOS-latest

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 1
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        distribution: 'corretto'
        java-version: '25'
        cache: 'gradle'
    - name: Build with Gradle
      run: chmod +x gradlew && ./gradlew test --no-daemon

  build-sonar:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '25'
          cache: 'maven'
      - name: Build and analyze
        run: mvn -B compile 
