# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 3 optimizations:
# - [HIGH] Add npm dependency cache to "build" job
# - [HIGH] Split "build" into parallel jobs (lint + test + build)
# - [MEDIUM] Add concurrency group to "build.yml"
# Estimated savings: ~12 min/run
#
name: Build
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    name: Sprotty CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
        env:
          NODE_ENV: development
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
