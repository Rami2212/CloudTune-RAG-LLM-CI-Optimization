# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 2 optimizations:
# - [HIGH] Add npm dependency cache to "test-on-ubuntu" job
# - [MEDIUM] Add concurrency group to "run-tests.yml"
# Estimated savings: ~6 min/run
#
on:
    push:
        branches:
            - master

    pull_request:
        types: [opened, edited]
        branches:
            - master

    workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
    test-on-ubuntu:
        name: Testing Workflow Linux
        runs-on: ubuntu-latest
        env:
            SIGNER_CERT: ${{ secrets.SIGNER_CERT }}
            SIGNER_KEY: ${{ secrets.SIGNER_KEY }}
            WWDR: ${{ secrets.WWDR }}
            SIGNER_KEY_PASSPHRASE: ${{ secrets.SIGNER_KEY_PASSPHRASE }}
        steps:
            - uses: pnpm/action-setup@v4
              with:
                  version: 9
            - uses: actions/checkout@v3
            - uses: actions/setup-node@v3
              with:
                  node-version: "20.x"
                  check-latest: true
            - run: |
                  pnpm install
                  pnpm build
                  pnpm test
