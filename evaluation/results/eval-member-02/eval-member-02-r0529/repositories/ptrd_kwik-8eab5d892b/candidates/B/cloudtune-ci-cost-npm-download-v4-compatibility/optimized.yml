# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 1 optimization:
# - [HIGH] Add gradle dependency cache to "build" job
# Estimated savings: ~5 min/run
#
on:
- push
- pull_request
- workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v5
      with:
        java-version: 17
        distribution: semeru
    - uses: gradle/actions/setup-gradle@v5
    - run: ./gradlew --version
    - run: ./gradlew build
