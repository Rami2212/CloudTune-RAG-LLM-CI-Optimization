name: Node.js CI

on:
    push:
        branches-ignore:
            - "dependabot/**"
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    CI: true
    FORCE_COLOR: 2

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-node@v6
              with:
                  node-version: lts/*
                  cache: npm
            - run: npm ci
            - run: npm ci --prefix scripts/benchmark
            - run: npm run lint
            - run: npm --prefix scripts/benchmark run lint

    test:
        name: Node ${{ matrix.node }}
        runs-on: ubuntu-latest
        timeout-minutes: 5

        strategy:
            fail-fast: false
            matrix:
                node:
                    - '20'
                    - '22'
                    - '24'
                    - 'lts/*'

        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  submodules: true
            - name: Use Node.js ${{ matrix.node }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm ci
            - run: npm run build --if-present
            - run: npm run test:vi