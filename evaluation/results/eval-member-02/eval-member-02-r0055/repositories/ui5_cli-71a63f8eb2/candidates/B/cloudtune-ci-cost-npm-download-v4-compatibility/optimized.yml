# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 1 optimization:
# - [HIGH] Add npm dependency cache to "security-scan" job
# Estimated savings: ~4 min/run
#
name: Security Audit
'on':
  schedule:
    - cron: 36 4 * * *
  workflow_dispatch: null
permissions: {}
jobs:
  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch:
          - main
          - v4
    steps:
      - name: Checkout '${{ matrix.branch }}' branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.branch }}
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Use audit-ci
        run: npm run audit
