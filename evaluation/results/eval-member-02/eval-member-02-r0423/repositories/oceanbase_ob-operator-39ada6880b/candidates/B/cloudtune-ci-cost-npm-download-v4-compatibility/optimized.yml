# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 2 optimizations:
# - [HIGH] Split "ui-lint" into parallel jobs (lint + test + build)
# - [MEDIUM] Add concurrency group to "ui-lint.yml"
# Estimated savings: ~8 min/run
#
name: Lint UI with eslint and prettier
on:
  pull_request:
    branches:
      - master
      - "*_release"
    paths:
      - "ui/**/*"


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ui-lint:
    name: ui-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "yarn"
          cache-dependency-path: ui/yarn.lock
      - name: Install dependencies
        run: cd ui && yarn install --frozen-lockfile
      - name: Check code style
        run: cd ui && yarn check-style
      - name: Lint
        run: cd ui && yarn lint
      - name: build
        run: cd ui && yarn build
