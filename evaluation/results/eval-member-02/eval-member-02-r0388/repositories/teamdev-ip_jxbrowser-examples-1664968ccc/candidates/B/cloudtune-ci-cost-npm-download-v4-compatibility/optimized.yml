# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 2 optimizations:
# - [HIGH] Add gradle dependency cache to "check" job
# - [LOW] Use shallow clone in "check" job
# Estimated savings: ~5 min/run
#
name: Check Examples
on: pull_request

jobs:
  check:
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: oracle
      - run: |-
          ./gradlew build
