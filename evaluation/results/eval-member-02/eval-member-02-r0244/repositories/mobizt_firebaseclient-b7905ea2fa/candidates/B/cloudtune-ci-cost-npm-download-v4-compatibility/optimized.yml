# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 1 optimization:
# - [MEDIUM] Add concurrency group to "cpp_lint.yml"
# Estimated savings: ~2 min/run
#
name: cpplint

on:
   pull_request:
      paths-ignore:
       - '.github/workflows/compile_*.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: cpplint
        uses: reviewdog/action-cpplint@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-check
          flags: --linelength=100
          filter: "-whitespace/tab\
           ,-readability/braces\
           ,-whitespace/braces\
           ,-whitespace/comments\
           ,-whitespace/indent\
           ,-whitespace/newline\
           ,-whitespace/operators\
           ,-whitespace/parens\
           "