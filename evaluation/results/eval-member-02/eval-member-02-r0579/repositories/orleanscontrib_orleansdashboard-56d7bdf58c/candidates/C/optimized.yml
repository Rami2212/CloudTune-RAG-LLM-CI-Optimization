name: .NET Core

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.200
        cache: true
        
    - name: Test
      run: |
        cd Tests/UnitTests
        dotnet test
        cd ../../
        
    - name: Build
      run: |
        dotnet build ./OrleansDashboard.sln --configuration Release
  
    - name: Publish
      run: |
        dotnet nuget push **/Release/*.*.nupkg --source 'https://api.nuget.org/v3/index.json' -k ${{ secrets.nuget }} --skip-duplicate
      if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/4.0'
