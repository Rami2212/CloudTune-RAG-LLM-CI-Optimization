# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 1 optimization:
# - [MEDIUM] Add concurrency group to "ci.yml"
# Estimated savings: ~2 min/run
#
name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '>=1.25.0'

      - name: Install dependencies
        run: |
          make install

      - name: Test cli
        run: |
          make test-cli

      - name: Test app
        run: |
          make test-api

      - name: Test e2e
        run: |
          make test-e2e
