# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 3 optimizations:
# - [HIGH] Add npm dependency cache to "cli-binary-smoke" job
# - [HIGH] Add npm dependency cache to "self-host-schema" job
# - [HIGH] Add npm dependency cache to "desktop-installer-smoke" job
# Estimated savings: ~12 min/run
#
name: CI
'on':
  pull_request:
    branches:
      - prod
  schedule:
    - cron: 53 4 * * 1
  workflow_dispatch: null
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changes:
    name: Detect changes
    runs-on: ${{ vars.CI_RUNNER_S || 'ubuntu-24.04' }}
    timeout-minutes: 5
    outputs:
      app_runtime: ${{ steps.filter.outputs.app_runtime }}
      frontend: ${{ steps.filter.outputs.frontend }}
      cli: ${{ steps.filter.outputs.cli }}
      sandbox_agent: ${{ steps.filter.outputs.sandbox_agent }}
      sandbox_image: ${{ steps.filter.outputs.sandbox_image }}
      desktop: ${{ steps.filter.outputs.desktop }}
      self_host: ${{ steps.filter.outputs.self_host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          filters: |
            # Shared foundation for the pnpm-installed jobs (frontend/cli/self-host):
            # a change here can break any of their installs/typechecks.
            pnpm: &pnpm
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.npmrc'
              - 'tsconfig.base.json'
              - '.github/workflows/ci.yml'
            app_runtime:
              - '.github/workflows/ci.yml'
              - 'apps/kortix-app-runtime/**'
              # build_test.go asserts the Caddy pin in this file.
              - 'apps/api/Dockerfile'
            frontend:
              - *pnpm
              - 'apps/web/**'
              - 'packages/shared/**'
            cli:
              - *pnpm
              - 'apps/cli/**'
              - 'packages/manifest-schema/**'
              - 'packages/starter/**'
            sandbox_agent:
              - '.github/workflows/ci.yml'
              - 'tsconfig.base.json'
              - 'apps/kortix-sandbox-agent-server/**'
              - 'packages/shared/src/ssrf-guard.ts'
              # Bundled into the daemon (KORTIXD_SHARED_SOURCES).
              - 'packages/api-contract/src/**'
              - 'packages/sdk/src/core/session/wire-message-id.ts'
              - 'packages/sdk/src/core/wire-values.ts'
              - 'packages/voice/src/**'
            sandbox_image:
              - '.github/workflows/ci.yml'
              - 'apps/sandbox/Dockerfile'
              - 'scripts/check-sandbox-apt-packages.sh'
            desktop:
              - '.github/workflows/ci.yml'
              - 'apps/desktop-electron/**'
            # self-host stack: anything that can break `kortix self-host start`'s
            # from-scratch DB bootstrap or the CLI's compose generation.
            self_host:
              - *pnpm
              - 'apps/api/Dockerfile'
              - 'apps/kortix-app-runtime/**'
              - 'apps/api/src/snapshots/builder.ts'
              - 'apps/api/src/config.ts'
              - 'packages/db/**'
              - 'apps/cli/src/commands/self-host.ts'
              - 'apps/cli/src/self-host/**'
              - 'apps/cli/scripts/self-host-e2e/**'
  frontend-build:
    name: Frontend build
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name != 'pull_request'
    runs-on: ${{ vars.CI_RUNNER_L || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - name: Install pnpm
        run: |
          corepack enable pnpm
          echo "pnpm: $(pnpm -v)  node: $(node -v)"
      - name: Install dependencies (frontend + workspace deps)
        run: pnpm install --frozen-lockfile --filter "./apps/web..."
        env:
          npm_config_engine_strict: 'false'
      - name: Enforce frontend lint
        run: pnpm --dir apps/web exec eslint src --quiet
      - name: Lint translations
        run: pnpm --dir apps/web run lint:i18n
      - name: Restore Turbopack build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: apps/web/.next/cache
          key: nextjs-turbopack-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nextjs-turbopack-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Build standalone frontend
        run: pnpm --filter ./apps/web build
        env:
          NODE_OPTIONS: '--max-old-space-size=6144'
          NEXT_PUBLIC_BACKEND_URL: http://localhost:8008/v1
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: local-build-placeholder-anon-key
          NEXT_PUBLIC_BILLING_ENABLED: 'false'
          NEXT_OUTPUT: standalone
  app-runtime-tests:
    name: App runtime Go tests
    needs: changes
    if: needs.changes.outputs.app_runtime == 'true' || github.event_name != 'pull_request'
    runs-on: ${{ vars.CI_RUNNER_S || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: apps/kortix-app-runtime/go.mod
          cache: false
      - name: Go tests
        working-directory: apps/kortix-app-runtime
        run: go test ./...
  sandbox-agent-build:
    name: Sandbox agent build
    needs: changes
    if: needs.changes.outputs.sandbox_agent == 'true' || github.event_name != 'pull_request'
    runs-on: ${{ vars.CI_RUNNER_M || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Read the daemon Bun version
        id: daemon-bun
        run: echo "version=$(jq -r .engines.bun apps/kortix-sandbox-agent-server/package.json)" >> "$GITHUB_OUTPUT"
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ steps.daemon-bun.outputs.version }}
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: apps/kortix-sandbox-agent-server
      - name: Import boundaries
        run: bun run lint && bun run test:architecture
        working-directory: apps/kortix-sandbox-agent-server
      - name: Build Linux sandbox agent daemon
        run: BUN_COMPILE_TARGET=bun-linux-x64 bun run build
        working-directory: apps/kortix-sandbox-agent-server
      - name: Verify binary exists
        run: |
          test -x apps/kortix-sandbox-agent-server/dist/kortix-agent
          ls -lh apps/kortix-sandbox-agent-server/dist/kortix-agent
  sandbox-image-packages:
    name: Sandbox image apt packages
    needs: changes
    if: needs.changes.outputs.sandbox_image == 'true' || github.event_name != 'pull_request'
    runs-on: ${{ vars.CI_RUNNER_S || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Every apt package the sandbox image installs resolves
        run: bash scripts/check-sandbox-apt-packages.sh
  cli-binary-smoke:
    name: CLI binary smoke
    needs: changes
    if: needs.changes.outputs.cli == 'true' || github.event_name != 'pull_request'
    runs-on: ${{ vars.CI_RUNNER_M || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - name: Install pnpm
        run: |
          corepack enable pnpm
          echo "pnpm: $(pnpm -v)  node: $(node -v)  bun: $(bun -v)"
      - name: Install dependencies (CLI + workspace deps)
        run: pnpm install --frozen-lockfile --filter "@kortix/cli..."
        env:
          npm_config_engine_strict: 'false'
      - name: Build Linux CLI binary
        run: |
          bun build \
            --compile \
            --minify \
            --target=bun-linux-x64 \
            --outfile=/tmp/kortix-cli-smoke \
            apps/cli/src/index.ts
      - name: Smoke test binary
        run: /tmp/kortix-cli-smoke version
  self-host-schema:
    name: Self-host schema bootstrap
    needs: changes
    if: needs.changes.outputs.self_host == 'true' || github.event_name != 'pull_request'
    runs-on: ${{ vars.CI_RUNNER_M || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - name: Install pnpm
        run: |
          corepack enable pnpm
          echo "pnpm: $(pnpm -v)  node: $(node -v)  bun: $(bun -v)"
      - name: Install dependencies (CLI + workspace deps)
        run: pnpm install --frozen-lockfile --filter "@kortix/cli..."
        env:
          npm_config_engine_strict: 'false'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build API image
        run: docker build --load --cache-from type=registry,ref=kortix/kortix-api:dev-buildcache --build-arg SERVICE=apps/api -f apps/api/Dockerfile -t kortix/kortix-api:selfhost-local .
      - name: Self-host schema-bootstrap check (fresh DB)
        run: bash apps/cli/scripts/self-host-e2e/schema-check.sh
        env:
          API_IMAGE: kortix/kortix-api:selfhost-local
  desktop-installer-smoke:
    name: Desktop installer smoke
    needs: changes
    if: needs.changes.outputs.desktop == 'true' || github.event_name != 'pull_request'
    runs-on: ${{ vars.CI_RUNNER_M_2204 || 'ubuntu-22.04' }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - name: Install pnpm
        run: corepack enable pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @kortix/desktop-electron --filter @kortix/agent-tunnel
        env:
          npm_config_engine_strict: 'false'
      - name: Ensure Electron runtime
        run: pnpm --filter @kortix/desktop-electron exec node scripts/ensure-runtime.js
      - name: Build Linux desktop installer (Electron, unsigned)
        run: pnpm --filter @kortix/desktop-electron exec electron-builder --linux --publish never
        env:
          KORTIX_DESKTOP_DEFAULT_URL: https://dev.kortix.com/workspaces
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify installer exists
        run: |
          shopt -s nullglob
          files=(apps/desktop-electron/dist/*.AppImage)
          test "${#files[@]}" -gt 0
          ls -lh "${files[@]}"
  lockfile-advisories:
    name: GHSA lockfile advisory check
    runs-on: ${{ vars.CI_RUNNER_S || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Check root lockfile against GHSA advisories
        run: node scripts/ghsa-audit.mjs
      - name: Check scanner lockfile against GHSA advisories
        if: always()
        working-directory: .deepsec
        run: npx --yes pnpm@9.15.4 audit --audit-level moderate
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: always()
        with:
          bun-version: 1.4.4
      - name: Check daemon lockfile against GHSA advisories
        if: always()
        working-directory: apps/kortix-sandbox-agent-server
        run: bun audit --audit-level moderate --ignore=GHSA-mrhx-c7xc-m3w5
  dependency-scan:
    name: Dependency + secret scan
    runs-on: ${{ vars.CI_RUNNER_S || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install checksum-verified Trivy from GitHub Releases
        run: |
          bash infra/scripts/install-trivy.sh "$RUNNER_TEMP/trivy-bin"
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"
      - name: Trivy filesystem (fail on CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
