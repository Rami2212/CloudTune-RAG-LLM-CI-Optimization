# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 3 optimizations:
# - [HIGH] Add npm dependency cache to "build" job
# - [MEDIUM] Add concurrency group to "webpack.yml"
# - [LOW] Explicitly set fail-fast for large matrix job "build" (5 combinations)
# Estimated savings: ~8 min/run
#
name: NodeJS with Webpack
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version:
          - 18.x
          - 20.x
          - 22.x
          - 24.x
          - 26.x
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Build
        run: |
          npm run update
          npm run lib
