name: Homebrew Build and Installation Tests

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      run_install_tests:
        description: "Run installation tests"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  test-homebrew-build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-brew-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            ${{ runner.os }}-brew-

      - name: Verify Homebrew is installed
        run: |
          echo "Homebrew version:"
          brew --version

      - name: Install GoReleaser
        run: brew install goreleaser

      - name: Make test script executable
        run: chmod +x test-scripts/test-homebrew-build.sh

      - name: Run build validation
        run: ./test-scripts/test-homebrew-build.sh

      - name: Run installation tests
        run: ./test-scripts/test-homebrew-build.sh --install

      # Upload generated Homebrew formula (cask distribution has been disabled)
      - name: Upload generated Homebrew files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-files
          path: |
            dist/homebrew/Formula/hookdeck-beta.rb
          retention-days: 7