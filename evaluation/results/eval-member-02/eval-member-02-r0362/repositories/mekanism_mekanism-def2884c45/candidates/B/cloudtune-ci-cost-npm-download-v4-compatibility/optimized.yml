# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 2 optimizations:
# - [HIGH] Add gradle dependency cache to "test" job
# - [MEDIUM] Add concurrency group to "gametests.yml"
# Estimated savings: ~7 min/run
#
name: "Run Game Tests"

on:
  push:
    branches: [ "26.3" ]
  pull_request:
    branches: [ "26.3" ]
    types:
      - synchronize
      - opened
      - ready_for_review
      - reopened
    paths:
      - '**.java'


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Game Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Run Game Tests with Gradle
        run: sh gradlew runGameTestServer

      - name: Run Unit Tests with Gradle
        run: sh gradlew test