# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 5 optimizations:
# - [HIGH] Add npm dependency cache to "lint" job
# - [HIGH] Add npm dependency cache to "test" job
# - [MEDIUM] 3 jobs clone the repo — consider artifact sharing
# - [MEDIUM] Use "npm ci" instead of "npm install" in "test"
# - [LOW] Explicitly set fail-fast for large matrix job "test" (18 combinations)
# Estimated savings: ~12 min/run
#
name: ci
'on':
  push:
    branches:
      - master
      - develop
      - 4.x
      - 5.x
      - '5.0'
    paths-ignore:
      - '*.md'
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }} ✨ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts --include=dev
      - name: Run lint
        run: npm run lint
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node-version:
          - 18
          - 19
          - 20
          - 21
          - 22
          - 23
          - 24
          - 25
          - 26
    name: Node.js ${{ matrix.node-version }} - ${{matrix.os}}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Configure npm loglevel
        run: |
          npm config set loglevel error
        shell: bash
      - name: Install dependencies
        run: npm install
      - name: Output Node and NPM versions
        run: |
          echo "Node.js version: $(node -v)"
          echo "NPM version: $(npm -v)"
      - name: Run tests
        shell: bash
        run: npm run test-ci
      - name: Upload code coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-node-${{ matrix.node-version }}-${{ matrix.os }}
          path: ./coverage/lcov.info
          retention-days: 1
  coverage:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install lcov
        shell: bash
        run: sudo apt-get -y install lcov
      - name: Collect coverage reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: ./coverage
          pattern: coverage-node-*
      - name: Merge coverage reports
        shell: bash
        run: find ./coverage -name lcov.info -exec printf '-a %q\n' {} \; | xargs lcov -o ./lcov.info
      - name: Upload coverage report
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329
        with:
          file: ./lcov.info
