# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 1 optimization:
# - [MEDIUM] Add concurrency group to "ci.yml"
# Estimated savings: ~2 min/run
#
name: CI

on:
  push:
    branches:
      - "master"
  pull_request:
    branches:
      - "master"


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  HUSKY: 0

jobs:
  check:
    name: Run ${{ matrix.script }} code check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: true
      matrix:
        script: ["format", "lint:ci", "typecheck:ci", "seo:check"]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install Dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.script }}
        run: |
          pnpm run ${{ matrix.script }}
