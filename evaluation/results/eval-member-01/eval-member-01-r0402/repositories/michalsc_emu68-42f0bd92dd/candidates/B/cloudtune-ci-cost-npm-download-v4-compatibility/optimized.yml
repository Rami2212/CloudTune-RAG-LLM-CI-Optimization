# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 1 optimization:
# - [MEDIUM] Add concurrency group to "policy.yml"
# Estimated savings: ~2 min/run
#
name: Policy

on:
  push:
  pull_request:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7

    - name: Check AGENTS.md rules
      run: bash scripts/check-policy.sh
