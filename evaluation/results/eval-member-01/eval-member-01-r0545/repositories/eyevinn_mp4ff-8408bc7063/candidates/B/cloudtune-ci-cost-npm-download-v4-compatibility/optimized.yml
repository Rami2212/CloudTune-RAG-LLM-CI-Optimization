# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 3 optimizations:
# - [MEDIUM] Add concurrency group to "go.yml"
# - [LOW] Explicitly set fail-fast for large matrix job "build" (6 combinations)
# - [LOW] Use shallow clone in "changelog" job
# Estimated savings: ~4 min/run
#
name: Go

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
        go-version: ["1.24", "stable"]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Go dependencies
        run: go mod download
        env:
          GOPROXY: "https://proxy.golang.org"

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the check looks for the tag of the latest version

      - name: Check changelog entries
        run: scripts/check-changelog.sh

  test-386:
    # 32-bit int and uint. linux/amd64 runs 386 binaries natively.
    runs-on: ubuntu-latest
    env:
      GOARCH: "386"
    steps:
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Go dependencies
        run: go mod download
        env:
          GOPROXY: "https://proxy.golang.org"

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test ./...
