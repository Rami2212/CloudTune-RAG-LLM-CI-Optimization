# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 2 optimizations:
# - [MEDIUM] Add concurrency group to "nox.yml"
# - [LOW] Explicitly set fail-fast for large matrix job "test" (12 combinations)
# Estimated savings: ~4 min/run
#
name: nox

on:
  pull_request:
  push:
    branches: [main]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v6
    - name: Test with nox using minimal dependencies
      run: uv run --group nox nox -e "pytest_min_deps-${{ matrix.python-version }}"
    - name: Test with nox with all dependencies
      run: uv run --group nox nox -e "pytest_all_deps-${{ matrix.python-version }}"

  test-rust-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install uv
      uses: astral-sh/setup-uv@v6
    - name: Test with nox with the Rust triangulation backend
      run: uv run --group nox nox -e pytest_rust_backend
