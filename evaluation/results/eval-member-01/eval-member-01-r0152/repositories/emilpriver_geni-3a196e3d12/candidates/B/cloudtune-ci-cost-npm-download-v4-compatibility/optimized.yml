# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 2 optimizations:
# - [HIGH] Add cargo dependency cache to "test" job
# - [MEDIUM] Add concurrency group to "nix.yaml"
# Estimated savings: ~10 min/run
#
name: Nix

on:
  pull_request:
  push:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup
      run: |
        sudo apt-get update
        sudo apt-get install -y mariadb-client
    - name: Run tests
      run: cargo test --verbose
  nix:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v25
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - name: Nix flake check
      run: nix flake check
    - name: Test nix build
      run: | 
        nix run . -- --help | grep -qE "Usage: geni( \[OPTIONS\])? <COMMAND>" || exit 2
