# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 2 optimizations:
# - [HIGH] Add npm dependency cache to "Build-and-Deploy" job
# - [MEDIUM] Use "npm ci" instead of "npm install" in "Build-and-Deploy"
# Estimated savings: ~5 min/run
#
name: Ct.js Nightly
on:
  push:
    branches:
    - develop
jobs:
  Build-and-Deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
    - name: Install intermediate dependencies
      run: npm install
    - name: Initialize the development environment
      run: gulp -f devSetup.gulpfile.js
    - name: Build and publish the app
      run: gulp deploy --nightly --buildNum=$GITHUB_SHA
      env:
        BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
