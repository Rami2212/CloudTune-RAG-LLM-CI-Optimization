# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 1 optimization:
# - [HIGH] Add npm dependency cache to "build" job
# Estimated savings: ~4 min/run
#
name: Test
on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-v: [20.x, 22.x, 24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node }}

      - name: Fetch submodules
        run: git submodule update --init

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm run test
