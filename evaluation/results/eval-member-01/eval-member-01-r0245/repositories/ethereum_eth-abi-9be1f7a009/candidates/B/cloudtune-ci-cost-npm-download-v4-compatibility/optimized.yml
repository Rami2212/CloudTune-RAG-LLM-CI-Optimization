# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 4 optimizations:
# - [LOW] Explicitly set fail-fast for large matrix job "test" (10 combinations)
# - [LOW] Use shallow clone in "linting" job
# - [LOW] Use shallow clone in "type-check" job
# - [LOW] Use shallow clone in "test" job
# Estimated savings: ~2 min/run
#
on: ["push", "pull_request"]

name: Test

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
      - run: uv run --group lint ruff check .
      - run: uv run --group lint ruff format --check .
      - run: uv run --group lint mdformat --check *.md

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
      - run: uv run --group lint --group test mypy -p eth_abi

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run --group test pytest tests/core
