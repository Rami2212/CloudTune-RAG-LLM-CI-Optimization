# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 2 optimizations:
# - [HIGH] Add npm dependency cache to "build" job
# - [MEDIUM] Use "npm ci" instead of "npm install" in "build"
# Estimated savings: ~5 min/run
#
name: Lint

permissions:
  contents: read

on: [push, pull_request]

jobs:
  build:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Install
        run: npm install

      - name: Test
        run: npm test
