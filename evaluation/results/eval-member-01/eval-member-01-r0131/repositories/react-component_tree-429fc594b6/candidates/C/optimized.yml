name: Surge Preview

on:
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: surge-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: surge-preview-node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('package.json') }}
          restore-keys: |
            surge-preview-node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-