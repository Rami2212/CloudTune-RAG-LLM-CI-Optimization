# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 3 optimizations:
# - [HIGH] Add pip dependency cache to "build" job
# - [MEDIUM] Add concurrency group to "test.yml"
# - [LOW] Explicitly set fail-fast for large matrix job "build" (10 combinations)
# Estimated savings: ~7 min/run
#
name: Test

on:
  push:
  pull_request:

# Sources of supported versions:
# * https://github.com/actions/python-versions/blob/main/versions-manifest.json
# * https://downloads.python.org/pypy/versions.json

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:

    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - python-version: "3.15"
            with-opt-deps: true
            runs-on: ubuntu-22.04

          - python-version: "3.14"
            with-opt-deps: true
            runs-on: ubuntu-22.04

          - python-version: "3.13.0"
            with-opt-deps: true
            runs-on: ubuntu-22.04

          - python-version: "3.12.0"
            with-opt-deps: true
            runs-on: ubuntu-22.04

          - python-version: "3.11"
            with-opt-deps: true
            runs-on: ubuntu-22.04
          - python-version: "pypy-3.11"
            with-opt-deps: true
            runs-on: ubuntu-22.04

          - python-version: "3.10"
            with-opt-deps: true
            runs-on: ubuntu-22.04
          - python-version: "3.10"
            with-opt-deps: false
            runs-on: ubuntu-22.04

          - python-version: "3.9"
            with-opt-deps: true
            runs-on: ubuntu-22.04
          - python-version: "pypy-3.9"
            with-opt-deps: false
            runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: |
          python3 -m pip install --upgrade pip setuptools

      - name: Install optional dependencies
        if: ${{ matrix.with-opt-deps }}
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt

      - name: Install
        run: |
          pip install .

      - name: Test with unittest
        run: |
          supybot-test test -v --plugins-dir=./plugins/ --no-network

      - name: Test with irctest
        if: "${{ matrix.with-opt-deps && matrix.python-version != 'pypy-3.9' }}"
        run: |
          git clone https://github.com/progval/irctest.git
          cd irctest
          pip3 install -r requirements.txt
          make limnoria PYTEST_ARGS=-vs
