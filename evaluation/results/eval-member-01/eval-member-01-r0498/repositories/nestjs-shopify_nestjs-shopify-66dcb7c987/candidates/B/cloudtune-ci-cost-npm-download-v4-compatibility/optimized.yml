# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 4 optimizations:
# - [MEDIUM] Add concurrency group to "tests.yaml"
# - [LOW] Use shallow clone in "lint" job
# - [LOW] Use shallow clone in "test" job
# - [LOW] Use shallow clone in "build" job
# Estimated savings: ~2 min/run
#
name: tests
on:
  push:
    branches:
      - main
  pull_request:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm
      - uses: nrwl/nx-set-shas@v4
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm

      - uses: nrwl/nx-set-shas@v4
      - run: npm ci
      # TODO: re-enable when it stops erroring constantly about package.json
      # - run: npx nx format:check
      - run: npx nx affected:test --ci --code-coverage

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: npm

      - uses: nrwl/nx-set-shas@v4
      - run: npm ci
      - run: npx nx affected:build
