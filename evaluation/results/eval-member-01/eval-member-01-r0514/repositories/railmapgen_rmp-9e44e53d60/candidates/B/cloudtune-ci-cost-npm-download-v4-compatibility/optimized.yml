# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 2 optimizations:
# - [HIGH] Add npm dependency cache to "check" job
# - [MEDIUM] Add concurrency group to "code-check.yml"
# Estimated savings: ~6 min/run
#
name: Code Quality Check
'on':
  pull_request: null
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm i
      - run: npm i rollup
      - name: Check
        run: |
          npm run lint
          npm run test
