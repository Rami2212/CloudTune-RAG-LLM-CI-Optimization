name: Swift

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: macOS-latest

    steps:
    - uses: actions/checkout@v1
    - name: Cache Swift package dependencies
      uses: actions/cache@v3
      with:
        path: .build/checkouts
        key: ${{ runner.os }}-swift-deps-${{ hashFiles('Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-swift-deps-
    - name: Build
      run: swift build -v