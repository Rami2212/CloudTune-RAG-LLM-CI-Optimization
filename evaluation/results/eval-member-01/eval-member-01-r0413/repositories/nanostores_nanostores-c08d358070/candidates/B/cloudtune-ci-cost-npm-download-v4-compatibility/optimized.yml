# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 5 optimizations:
# - [HIGH] Add npm dependency cache to "full" job
# - [HIGH] Add npm dependency cache to "short" job
# - [HIGH] Add npm dependency cache to "old" job
# - [HIGH] Add npm dependency cache to "benchmark" job
# - [MEDIUM] Add concurrency group to "test.yml"
# Estimated savings: ~18 min/run
#
name: Test
'on':
  push:
    branches:
      - main
      - next
  pull_request: null
permissions:
  contents: read
jobs:
  full:
    name: Node.js Latest Full
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Node.js & pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 12
          runtime: node@26
      - name: Install dependencies
        run: pnpm ci
      - name: Run tests
        run: pnpm test
  short:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node:
          - 24
          - 22
    name: Node.js ${{ matrix.node }} Quick
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Node.js & pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 12
          runtime: node@${{ matrix.node }}
      - name: Install dependencies
        run: pnpm ci
      - name: Run unit tests
        run: pnpm bnt
  old:
    runs-on: ubuntu-latest
    name: Node.js 20 Quick
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10
      - name: Install Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: pnpm install --ignore-scripts
      - name: Run unit tests
        run: pnpm bnt
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Node.js & pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 11
          runtime: node@26
      - name: Install dependencies
        run: pnpm install --ignore-scripts
      - name: Run benchmark
        run: node ./test/benchmark.js
