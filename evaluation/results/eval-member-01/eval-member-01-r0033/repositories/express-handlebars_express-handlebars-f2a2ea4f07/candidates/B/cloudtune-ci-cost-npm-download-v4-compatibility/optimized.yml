# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 8 optimizations:
# - [HIGH] Add npm dependency cache to "TestOS" job
# - [HIGH] Add npm dependency cache to "TestNode" job
# - [HIGH] Add npm dependency cache to "Coverage" job
# - [HIGH] Add npm dependency cache to "Lint" job
# - [HIGH] Add npm dependency cache to "Build" job
# - [HIGH] Add npm dependency cache to "Release" job
# - [MEDIUM] Add concurrency group to "main.yml"
# - [MEDIUM] 6 jobs clone the repo — consider artifact sharing
# Estimated savings: ~27 min/run
#
name: Tests
'on':
  pull_request: null
  push:
    branches:
      - master
permissions:
  contents: read
env:
  CI: true
jobs:
  TestOS:
    name: Test
    strategy:
      matrix:
        os:
          - macos-latest
          - windows-latest
        node_version:
          - lts/*
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node_version }}
          check-latest: true
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests 👩🏾‍💻
        run: npm run test
  TestNode:
    name: Test
    strategy:
      matrix:
        os:
          - ubuntu-latest
        node_version:
          - '20'
          - lts/*
          - '*'
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node_version }}
          check-latest: true
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests 👩🏾‍💻
        run: npm run test
  Coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          check-latest: true
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests 👩🏾‍💻
        run: npm run test:cover
  Lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          check-latest: true
          cache: npm
      - name: NPM install
        run: npm ci
      - name: Lint ✨
        run: npm run lint
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          check-latest: true
          cache: npm
      - name: NPM install
        run: npm ci
      - name: Build 🧱
        run: npm run build
  Release:
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    needs:
      - TestOS
      - TestNode
      - Coverage
      - Lint
      - Build
    if: |
      github.ref == 'refs/heads/master' &&
      github.event.repository.fork == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          check-latest: true
          cache: npm
      - name: NPM install
        run: npm ci
      - name: NPM build
        run: npm run build
      - name: Release 🎉
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
