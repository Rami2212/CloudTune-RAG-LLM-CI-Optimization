# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 1 optimization:
# - [MEDIUM] Add concurrency group to "check-licenses.yml"
# Estimated savings: ~2 min/run
#
name: Check Scheme Licenses

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "schemes/**"
      - "yaml/**"
      - "licenses.yml"
      - "tools/check_licenses.py"
      - "tools/test_check_licenses.py"
      - "tools/set_license.py"
      - "tools/test_set_license.py"
      - "tools/gen.py"
  push:
    branches:
      - master
    paths:
      - "schemes/**"
      - "yaml/**"
      - "licenses.yml"
      - "tools/check_licenses.py"
      - "tools/test_check_licenses.py"
      - "tools/set_license.py"
      - "tools/test_set_license.py"
      - "tools/gen.py"


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check-licenses:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libjpeg-dev
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check that every scheme has a licenses.yml entry
        run: python tools/check_licenses.py

      - name: Run check_licenses tests
        run: python tools/test_check_licenses.py

      - name: Run set_license tests
        run: python tools/test_set_license.py
