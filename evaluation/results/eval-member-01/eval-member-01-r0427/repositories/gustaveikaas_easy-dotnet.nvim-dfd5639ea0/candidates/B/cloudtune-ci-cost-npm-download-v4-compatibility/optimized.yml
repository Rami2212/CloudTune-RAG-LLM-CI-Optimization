# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 1 optimization:
# - [MEDIUM] Add concurrency group to "lint.yml"
# Estimated savings: ~2 min/run
#
name: Formatting check

on: 
  pull_request:

jobs:

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4

      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          args: --check .
          version: latest
