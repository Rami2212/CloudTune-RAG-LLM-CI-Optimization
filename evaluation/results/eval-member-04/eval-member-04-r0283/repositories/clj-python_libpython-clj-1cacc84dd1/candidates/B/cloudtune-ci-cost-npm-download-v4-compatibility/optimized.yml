# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 3 optimizations:
# - [HIGH] Add pip dependency cache to "unit-test" job
# - [MEDIUM] Add concurrency group to "test.yml"
# - [LOW] Explicitly set fail-fast for large matrix job "unit-test" (45 combinations)
# Estimated savings: ~7 min/run
#
name: test

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/README.md'
      - '**/CHANGELOG.md'
  pull_request:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-test:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        jdk: [19, 21, 25]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.jdk }}
          distribution: temurin

      - name: Install Clojure
        uses: DeLaGuardo/setup-clojure@11.0
        with:
          cli: 1.11.1.1347

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy --no-cache-dir

      - name: Run tests (jdk<17)
        if: ${{ matrix.jdk < 17 }}
        run: |
          clojure -M:test
      - name: Run tests (jdk>=17)
        if: ${{ matrix.jdk >= 17 }}
        run: |
          clojure -M:jdk-${{matrix.jdk}}:test
