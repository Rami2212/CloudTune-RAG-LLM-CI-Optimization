# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 3 optimizations:
# - [HIGH] Add npm dependency cache to "build" job
# - [MEDIUM] Add concurrency group to "jest.yml"
# - [LOW] Use shallow clone in "build" job
# Estimated savings: ~6 min/run
#
name: Run Test Suite

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    env:
      NODE_ENV: test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install depdencies
        run: npm ci

      - name: Run Test Suite
        run: npm run test
