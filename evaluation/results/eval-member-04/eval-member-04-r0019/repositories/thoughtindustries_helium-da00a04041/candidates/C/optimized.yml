name: Run Test Suite

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

jobs:
  build:
    env:
      NODE_ENV: test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install depdencies
        run: npm ci

      - name: Run Test Suite
        run: npm run test