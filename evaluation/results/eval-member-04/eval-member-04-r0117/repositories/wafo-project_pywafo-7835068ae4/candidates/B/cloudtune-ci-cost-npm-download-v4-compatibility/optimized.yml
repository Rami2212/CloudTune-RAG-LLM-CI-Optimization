# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 3 optimizations:
# - [HIGH] Add pip dependency cache to "run" job
# - [MEDIUM] Add concurrency group to "tests.yml"
# - [LOW] Explicitly set fail-fast for large matrix job "run" (8 combinations)
# Estimated savings: ~7 min/run
#

name: Tests

on:
  pull_request:
  push:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  run:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]
        os: [ubuntu-latest, macos-10.15]
      fail-fast: false

    steps:
    - uses: actions/checkout@v3

    - name: Setup Micromamba Python ${{ matrix.python-version }}
      uses: mamba-org/setup-micromamba@v1
      with:
        environment-name: TEST
        init-shell: bash
        create-args: >-
          python=${{ matrix.python-version }} --file requirements.txt --file requirements-dev.txt --channel conda-forge

    - name: Install GFortran macOS
      if: contains(matrix.os, 'macos')
      # available gfotran are: 8, 9, and 10 (latest)
      run: |
        ln -s /usr/local/bin/gfortran-10 /usr/local/bin/gfortran
        which gfortran

    - name: Install pywafo
      shell: bash -l {0}
      run: |
        python -m pip install -e . --no-deps --force-reinstall

    - name: Tests
      shell: bash -l {0}
      run: |
        pytest -s -rxs -v src
