# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 2 optimizations:
# - [HIGH] Switch "build" from macOS to ubuntu runner
# - [MEDIUM] Add concurrency group to "macos.yml"
# Estimated savings: ~2 min/run
#
name: macos-latest

on:
  push:
    branches: [ main, alpha, beta, sd/* ]
    paths: ['src/**', 'test/**', '!README.md' ]
  pull_request:
    branches: [ main ]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v3
    - name: Bash tests
      run: |
        dir=$PWD
        git clone https://github.com/shellgei/rusty_bash_test -b v1.3.3 --depth 1
        #git clone https://github.com/shellgei/rusty_bash_test --depth 1
        cd rusty_bash_test
        ./test.bash $dir
        #./test_fixed.bash build $dir
