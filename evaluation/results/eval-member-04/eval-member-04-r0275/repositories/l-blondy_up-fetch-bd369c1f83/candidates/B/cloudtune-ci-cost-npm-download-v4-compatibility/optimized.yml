# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 1 optimization:
# - [HIGH] Add npm dependency cache to "test-node" job
# Estimated savings: ~4 min/run
#
name: Test for Node.Js
'on':
  workflow_call: null
  workflow_dispatch: null
jobs:
  test-node:
    name: Test Node.js version "${{ matrix.node-version }}" on "ubuntu-latest"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 24
          - 22
          - ~20.3
          - 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test
