# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 2 optimizations:
# - [HIGH] Split "test" into parallel jobs (lint + test + build)
# - [MEDIUM] Add concurrency group to "test.yml"
# Estimated savings: ~8 min/run
#
name: Test

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
