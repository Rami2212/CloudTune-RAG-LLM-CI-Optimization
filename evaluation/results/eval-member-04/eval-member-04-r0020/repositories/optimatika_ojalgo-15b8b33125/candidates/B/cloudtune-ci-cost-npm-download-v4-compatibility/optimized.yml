# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 2 optimizations:
# - [HIGH] Add maven dependency cache to "build" job
# - [MEDIUM] Add concurrency group to "maven.yml"
# Estimated savings: ~7 min/run
#
name: Java CI with Maven

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Java 22, pure Java
            os: ubuntu-latest
            java-version: '22'
            maven-args: -Dojalgo.native.library=none
            native: false
          - name: Java 27, native BLAS
            os: ubuntu-latest
            java-version: '27'
            maven-args: -DargLine=--enable-native-access=ojalgo,ALL-UNNAMED
            openblas: true
            native: true
          - name: Java 27, macOS, Accelerate
            os: macos-latest
            java-version: '27'
            maven-args: -DargLine=--enable-native-access=ojalgo,ALL-UNNAMED
            native: true
          - name: Java 27, Windows, no native library
            os: windows-latest
            java-version: '27'
            maven-args: -DargLine=--enable-native-access=ojalgo,ALL-UNNAMED
            native: false

    steps:
    - name: Keep line endings as committed
      if: runner.os == 'Windows'
      run: git config --global core.autocrlf false
    - uses: actions/checkout@v7
    - name: Install OpenBLAS
      if: matrix.openblas
      run: sudo apt-get update && sudo apt-get install -y libopenblas0
    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v6
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
    - name: Build with Maven
      shell: bash
      run: ./mvnw -B package ${{ matrix.maven-args }}
      env:
        OJALGO_NATIVE_EXPECTED: ${{ matrix.native }}
