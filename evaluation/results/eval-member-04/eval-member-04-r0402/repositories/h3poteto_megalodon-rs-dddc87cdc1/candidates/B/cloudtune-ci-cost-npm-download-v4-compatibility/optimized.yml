# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 2 optimizations:
# - [HIGH] Add cargo dependency cache to "build" job
# - [MEDIUM] Add concurrency group to "build.yml"
# Estimated savings: ~10 min/run
#
name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
