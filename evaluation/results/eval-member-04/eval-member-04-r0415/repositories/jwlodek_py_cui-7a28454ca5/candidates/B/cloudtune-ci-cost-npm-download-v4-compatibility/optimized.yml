# Applied 1 optimization:
# - [MEDIUM] Add concurrency group to "build_docs_test.yml"
# Estimated savings: ~2 min/run
#
name: build docs

on:
  push:
    branches:
      - master
    paths:
      - '**.py'
  pull_request:
    branches:
      - master
    paths:
      - '**.py'


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build_docs:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    - name: Build Docs
      run: |
        cd docs/scripts && bash generateFromDocstrings.sh