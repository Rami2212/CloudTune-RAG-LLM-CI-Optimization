# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 1 optimization:
# - [HIGH] Add npm dependency cache to "build" job
# Estimated savings: ~4 min/run
#
name: Build
'on':
  workflow_dispatch: null
jobs:
  build:
    runs-on: ${{ matrix.os }}-latest
    strategy:
      matrix:
        os:
          - windows
          - macos
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: npm
      - run: |
          npm i
          npm run build
          npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
            release/**/*.dmg
            release/**/*.7z
            release/**/*-lates*.yml
