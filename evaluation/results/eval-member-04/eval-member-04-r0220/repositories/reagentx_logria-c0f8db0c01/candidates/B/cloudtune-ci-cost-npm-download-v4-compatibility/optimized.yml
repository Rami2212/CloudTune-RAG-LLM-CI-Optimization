# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 2 optimizations:
# - [HIGH] Add cargo dependency cache to "Test" job
# - [MEDIUM] Add concurrency group to "test.yml"
# Estimated savings: ~10 min/run
#
name: Test

on:
  pull_request:
    branches:
      - release
      - develop


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always

jobs:
  Test:
    name: Logria Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: cargo clippy
      - run: cargo test --verbose
