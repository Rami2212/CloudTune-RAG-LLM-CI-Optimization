# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 2 optimizations:
# - [HIGH] Add pip dependency cache to "build-docs" job
# - [MEDIUM] Add concurrency group to "docs-check.yml"
# Estimated savings: ~5 min/run
#
name: docs-check

on:
  pull_request:
  push:
    branches:
      - master
      - stable


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Build docs (strict)
        run: mkdocs build --strict
