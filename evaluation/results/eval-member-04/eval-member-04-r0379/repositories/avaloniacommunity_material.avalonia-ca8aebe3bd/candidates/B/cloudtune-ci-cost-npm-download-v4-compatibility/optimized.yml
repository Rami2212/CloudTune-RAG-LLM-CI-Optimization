# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 1 optimization:
# - [MEDIUM] Add concurrency group to "build-publish.yml"
# Estimated savings: ~2 min/run
#
name: Build and publish

on:
    push:
        branches:
            - '**'
        paths-ignore:
            - Material.Avalonia.Demo*/** # Ignore demo projects, do not trigger builds for them
        tags:
            - v**
    pull_request:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
    id-token: write
    contents: write

jobs:
    build:
        
        runs-on: ubuntu-latest
        
        steps:
            - uses: actions/checkout@v4
            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 10
            - name: Build and Publish
              uses: SKProCH/CommonWorkflows/actions/build-publish@main
              with:
                  publish-nightly: true
                  nuget-user: ${{ secrets.NUGET_USER }}