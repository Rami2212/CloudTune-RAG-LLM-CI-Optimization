# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 2 optimizations:
# - [HIGH] Add npm dependency cache to "generate-api" job
# - [LOW] Use shallow clone in "generate-api" job
# Estimated savings: ~4 min/run
#
name: Generate API from Spec
'on':
  workflow_dispatch: null
  schedule:
    - cron: 0 0 * * 0
jobs:
  generate-api:
    if: ${{ github.repository == 'opensearch-project/opensearch-js' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api_generator
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Config git to rebase
        run: git config --global pull.rebase true
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate API
        run: |-
          npm run download_spec
          npm run generate_api
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
      - name: Create pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
        with:
          push-to-fork: opensearch-ci-bot/opensearch-js
          token: ${{ secrets.OPENSEARCH_CI_BOT_TOKEN }}
          commit-message: Updated opensearch-js to reflect the latest OpenSearch API spec (${{ env.date }})
          title: '[AUTOCUT] Update opensearch-js to reflect the latest OpenSearch API spec (${{ env.date }})'
          body: |
            Update `opensearch-js` to reflect the latest [OpenSearch API spec](https://api-spec.opensearch.org/opensearch-openapi.yaml).
            Date: ${{ env.date }}
          branch: update-api-from-spec-${{ env.date }}
          base: main
          signoff: true
          labels: |
            autocut
