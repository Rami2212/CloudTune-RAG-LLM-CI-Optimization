name: Github Action

on:
  pull_request: # trigger on pull requests
  push:
    branches:
      - master # trigger on push to master

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        build: [linux, macos, windows]
        include:
          - build: linux
            os: ubuntu-latest
            rust: 1.46.0
          - build: macos
            os: macos-latest
            rust: 1.46.0
          - build: windows
            os: windows-latest
            rust: 1.46.0
    steps:
      - uses: actions/checkout@v2
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
          key: "${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}"
      - name: Build
        run: |
          make build
          make examples
          make bench_p2p
      - name: Run tests
        timeout-minutes: 40
        run: make test

  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
          key: "${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}"
      - name: Format check
        run: |
          rustup component add rustfmt
          make fmt

  clippy_check:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
          key: "${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}"
      - name: Clippy check
        run: |
          rustup component add clippy
          make clippy

  features_check:
    name: Features check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
          key: "${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}"
      - name: Features check
        run: |
          echo "stable" > rust-toolchain
          rustup target add wasm32-unknown-unknown
          rustup target add wasm32-wasip1
          make features-check

  fuzz_test:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
          key: "${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.toml', 'Cargo.lock') }}"
      - name: Fuzz test
        run: |
          rustup install nightly
          cargo +nightly install cargo-fuzz
          make fuzz