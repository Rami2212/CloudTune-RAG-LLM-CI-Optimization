# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 1 optimization:
# - [MEDIUM] Add concurrency group to "pr.yml"
# Estimated savings: ~2 min/run
#
name: pr

on:
  pull_request:
    branches:
      - symfony-5


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    name: Code build, lint and tests
    steps:
    - uses: actions/checkout@v1

    - name: Platform
      run: uname -m

    - name: Build
      run: make env=ci start

    - name: DDD LAYERS
      run: make env=ci layer

    - name: DB Schema validation
      run: make env=ci schema-validate

    - name: Static tools (analyzers)
      run: make env=ci cs-check;make env=ci phpstan;make env=ci layer;make env=ci psalm

    - name: Tests
      run: make env=ci conf="--coverage-clover build/logs/clover.xml" phpunit

    - name: ARTIFACT
      run: make env=ci artifact

    - name: Coveralls
      run: make env=ci coverage
