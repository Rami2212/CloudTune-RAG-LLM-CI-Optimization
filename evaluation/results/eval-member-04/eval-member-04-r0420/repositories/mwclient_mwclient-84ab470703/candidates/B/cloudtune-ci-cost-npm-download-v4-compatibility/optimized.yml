# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 3 optimizations:
# - [HIGH] Add pip dependency cache to "build" job
# - [LOW] Explicitly set fail-fast for large matrix job "build" (18 combinations)
# - [LOW] Use shallow clone in "build" job
# Estimated savings: ~5 min/run
#
---
name: Test Python package with Tox

on: ["push", "pull_request"]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      max-parallel: 4
      fail-fast: false
      matrix:
        python-version:
          - "3.7"
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15.0-alpha - 3.15"
        include:
          - os: "ubuntu-latest"
          - os: "ubuntu-22.04"
            python-version: "3.7"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox tox-gh-actions coverage
      - name: Test with tox
        run: tox
      - name: Produce coverage.lcov for coveralls
        if: matrix.python-version == '3.14'
        run: coverage lcov
      - name: Coveralls
        if: matrix.python-version == '3.14'
        uses: coverallsapp/github-action@5cbfd81b66ca5d10c19b062c04de0199c215fb6e # v2.3.7
