# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 2 optimizations:
# - [MEDIUM] Add concurrency group to "build.yml"
# - [LOW] Explicitly set fail-fast for large matrix job "build" (9 combinations)
# Estimated savings: ~4 min/run
#
name: build

on:
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      matrix:
        java: [ '11', '17', '21' ]
        os: [ 'ubuntu-latest', 'windows-latest', 'macos-latest' ]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6.1.0
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin

      - run: mvn --batch-mode verify
