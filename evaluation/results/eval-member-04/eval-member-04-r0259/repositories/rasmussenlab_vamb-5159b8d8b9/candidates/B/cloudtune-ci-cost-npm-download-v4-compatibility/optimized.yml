# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 1 optimization:
# - [MEDIUM] Add concurrency group to "unittest.yml"
# Estimated savings: ~2 min/run
#
name: Unittest

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # There is a bug in Python 3.13.0 which breaks Vamb's tests, fixed in 3.13.1
        python-version: ["3.10", "3.11", "3.12", "3.13.1"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # caching pip dependencies
        cache-dependency-path: '**/pyproject.toml'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install -e .
    - name: Run tests
      run: python -m pytest test
