# Optimized by ci-cost (https://github.com/mariotavarez/ci-cost)
# Applied 3 optimizations:
# - [HIGH] Add pip dependency cache to "build" job
# - [MEDIUM] Add concurrency group to "test-on-pr-windows.yml"
# - [MEDIUM] Switch "build" from Windows to ubuntu runner
# Estimated savings: ~5 min/run
#
# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python Test (Windows)

on:
  push:
    paths:
      - 'setup.py'
      - 'requirements.txt'
      - 'ptrlib/**'
      - 'tests/**'
  pull_request:
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:

    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if( Test-Path .\requirements.txt ){ pip install -r requirements.txt }
        pip install capstone keystone-engine
    - name: Test with pytest
      run: |
        '```' >> $env:GITHUB_STEP_SUMMARY
        python -m unittest *>> $env:GITHUB_STEP_SUMMARY
        '```' >> $env:GITHUB_STEP_SUMMARY
